[package]
name = "rail"
version = "0.1.0"
edition = "2024"
description = "A tiny browser that scrolls sideways: niri-style tabs on the system WebKitGTK"
rust-version = "1.85"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_12"] }
webkit6 = "0.6.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
codegen-units = 1
